<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            background-color: pink;
            text-align: center;
        }

        h1 {
            color: rgb(97, 14, 97);
            font-size: 50px;
        }

        p {
            color: black;
            font-size: 60px;
        }

        button {
            background-color: purple;
            color: white;
            font-size: 100px;
            padding: 12px 25px;
            border: none;
            border-radius: 20px;
            display: block;
            max-width: 40px auto;
            display: block;
            margin: 200px auto 0;

        }
        @media (max-width: 600) {

        h1 {
            font-size: 42px;
            margin-top: 12px;
        }    

        p {
            font-size: 24px;
            padding: 0 20px;
        }

        button {
            font-size: 24px;
            padding: 20px 40px;

           }
        } 
        .heart {
            position: fixed;
            font-size: 30px;
            animation: fly 1.5s ease-out forwards;
            pointer-events: none;

        }
        
        @keyframes fly {
            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }

            100% {
                transform: translateY(-300px) scale(1.5);
                opacity: 0;
            }
        }

        #message {
            display: none;
            font-size: 30px;
            color: purple;
            margin-top: 30px;
        }

    </style>
</head>

<body>
    <h1> Тебе вітає Таміла!.</h1>

    <p> Ту мач бьютіфул!!.</p>

    <button onclick="sayHello()">Тикай!</button>
    <div id="message">❤️ Надобраніч! ❤️</div>

    <script>
        function sayHello() {
            document.getElementById("message").style.display = "block";
            for (let i = 0; i < 15; i++) {

        let heart = document.createElement("div");

        heart.innerHTML = "❤️";

        heart.className = "heart";

        heart.style.left = Math.random() * 100 + "vw";
        heart.style.top = "70vh";

        document.body.appendChild(heart);

        setTimeout(function() {
            heart.remove();
        }, 1500);
    }
}
    </script>
